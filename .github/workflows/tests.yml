name: tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Windows Python does not include the IANA timezone database.
      - if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - run: python scripts/check.py
      - if: matrix.python == '3.12'
        run: python scripts/setup_network_storage.py "${{ runner.temp }}/pulse-storage-試験"
      - if: matrix.python == '3.12'
        run: python scripts/test_network_storage.py --copyparty "${{ runner.temp }}/pulse-storage-試験/copyparty-sfx.py"
